# Spoken (rusty-key/spoken-wow) ships the addon, its voice packs and a desktop
# app from one repo, told apart by tag prefix. Checked 2026-11-04 from the
# repo's releases and TOCs (none carry host IDs): the addon zip holds every
# module and its TOC is `## Interface: 16001`; the packs' TOCs list
# 11509, 20506, 16001 and declare `X-Part-Of: Spoken`, so they are separate
# entries. Packs are large (Quests 1.4 GB, Readables 453 MB, Places 435 MB,
# Bosses 149 MB). Only the English packs are listed.

[[addon]]
name = "Spoken"
repo = "rusty-key/spoken-wow"
tag = "spoken"
folder = "Spoken"
flavours = ["forever"]

[[addon]]
name = "Spoken Quests Audio"
repo = "rusty-key/spoken-wow"
tag = "quests-audio"
# Folder name not confirmed (the 1.4 GB zip was not downloaded to check).

[[addon]]
