name: Release

# Merging the "Release x.y.z" pull request (from prepare-release.yml) builds
# the Windows installer and publishes the GitHub release, tagged vx.y.z, with
# that version's CHANGELOG.md section as its notes. The app's opt-in update
# check reads the latest release.
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'release' && github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # An app that reports a different number from its release would nag
      # about an update forever.
      - name: Check every version file agrees
        shell: bash
        run: |
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          pkg_v=$(node -p "require('./app/package.json').version")
          tauri_v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$cargo_v" != "$pkg_v" ] || [ "$cargo_v" != "$tauri_v" ]; then
            echo "::error::Versions differ: Cargo.toml $cargo_v, package.json $pkg_v, tauri.conf.json $tauri_v."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: cargo test -p nexforge-core
      - run: pnpm tauri build
        working-directory: app
      - name: Collect the installer and its checksum
        shell: bash
        run: |
          mkdir artifacts
          cp target/release/bundle/msi/*.msi artifacts/
          (cd artifacts && sha256sum *.msi > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: artifacts
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.2
      - run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}
