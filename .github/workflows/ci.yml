name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p nexforge-core -p nexforge-cli --all-targets -- -D warnings
      # Tests use recorded fixtures only; no live network.
      - run: cargo test -p nexforge-core -p nexforge-cli --no-fail-fast

  app:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm check
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: cargo clippy -p nexforge-app --all-targets -- -D warnings
      - run: cargo test -p nexforge-app
