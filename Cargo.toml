[workspace]
resolver = "2"
members = ["crates/nexforge-core", "crates/nexforge-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Nexabyte Ltd"]
license = "MIT"
repository = "https://github.com/PerkinzPie/Nexforge"

[workspace.dependencies]
nexforge-core = { path = "crates/nexforge-core" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
